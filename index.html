<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ikura</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body data-view="loading">
  <main>
    <figure class="model">
      <img alt="" draggable="false">
      <p class="model-message" hidden>画像を読めませんでした</p>
      <figcaption>
        <span class="title"></span>
        <span class="meta"></span>
      </figcaption>
    </figure>
    <canvas id="grid"></canvas>
    <!-- 上の段にお手本と自分の塗り、下の段に数字と3値の正解。自分の塗りの真下に正解が来る -->
    <section class="result" aria-label="答え合わせ" hidden>
      <img class="result-model" alt="" draggable="false">
      <canvas class="result-mine" aria-label="自分の塗り"></canvas>
      <div class="result-numbers">
        <p class="result-total">一致 <strong></strong></p>
        <p class="result-value" data-value="2">明 <span></span></p>
        <p class="result-value" data-value="1">中 <span></span></p>
        <p class="result-value" data-value="0">暗 <span></span></p>
        <p class="result-time">時間 <span></span></p>
      </div>
      <canvas class="result-answer" aria-label="3値の正解"></canvas>
    </section>
    <div class="load-error" hidden>
      <p>作品の一覧を読めませんでした</p>
      <button type="button" id="retry">もう一度</button>
    </div>
  </main>
  <!-- 幅が足りないときは、塗る道具の段と、経過時間・別の絵・答え合わせの段の2段になる -->
  <footer class="toolbar">
    <div class="toolbar-paint">
      <div class="group" role="group" aria-label="色">
        <button type="button" class="swatch" data-color="2" aria-label="明" aria-pressed="false"></button>
        <button type="button" class="swatch" data-color="1" aria-label="中" aria-pressed="false"></button>
        <button type="button" class="swatch" data-color="0" aria-label="暗" aria-pressed="true"></button>
      </div>
      <div class="group" role="group" aria-label="道具">
        <button type="button" data-tool="brush1" aria-pressed="false">1マス</button>
        <button type="button" data-tool="brush3" aria-pressed="true">3×3</button>
        <button type="button" data-tool="fill" aria-pressed="false">塗りつぶし</button>
      </div>
      <button type="button" id="undo" disabled>戻す</button>
    </div>
    <div class="toolbar-session">
      <span class="timer" role="timer">0:00</span>
      <button type="button" id="swap">別の絵</button>
      <button type="button" id="check" disabled>答え合わせ</button>
      <button type="button" id="back">塗りにもどる</button>
    </div>
  </footer>
</body>
</html>
